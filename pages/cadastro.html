<!DOCTYPE html>
<html>
    <head>
        <title>Cadastro</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="../css/style.css">
    </head>

    <body>
        <header class="topo">
            <div class="logo">
                <a href="../index.html"></a>
                <img src="../img/cafe_central_logo_classic.png" width="90" height="90" style="display: block; margin: 0 auto" alt="">
            </div>
            <nav class="menu">
                <a href="../Index.html">Início</a>
                <a href="sobre.html">Sobre</a>
                <a href="contato.html">Contato</a>
            </nav>
        </header>
    
        <main class="container pagina-auth">
            
            <section class="bloco-auth">
                <h1>Cadastro</h1>

                <form class="form-auth" id="formLogin">
                    

                    <label for="nome">nome</label>
                    <input type="name" id="nomecadastro" placeholder="Digite seu nome" required>

                    <label for="Telefone">Telefone</label>
                    <input type="telefone" id="telefonecadastro" placeholder="Digite seu Telefone" required>

                    <label for="emailLogin">E-mail</label>
                    <input type="email" id="emailcadastro" placeholder="Digite seu e-mail" required>

                    <label for="senhaLogin">Senha</label>
                    <input type="password" id="senhacadastro" placeholder="Digite sua senha" required>

                    <button type="submit" class="btn-primario">Cadastrar</button>
                    <button type="reset" class="btn-segundario">cancelar</button>

                </form>

            </section>
        </main>
    
        <footer class="rodape"> <!-- Rodapé reutilizado -->
            <p>® 2026 Café Central. Todos os Direitos Reservados</p>
            <p><a href="contato.html">Entre em Contato</a></p>
        </footer>

        <script src="../js/auth.js"></script>
    </body>
</html>
