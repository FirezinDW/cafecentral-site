        <section class="Contato"><!-- Conteúdo da página -->
            <h3>Fale Conosco</h3>
            <!-- Inicio do Formulario-->
            <form id="formContato">
                <!--Campo de Nome-->
                <label for="Nome">Nome:</label>
                <input type="text" required id="Nome" placeholder="Digite seu Nome">
                <br> <br>
                <label for="email">Email:</label>
                <input type="text" required id="Email" placeholder="Digite seu Email">
                <br> <br>
                <label for="Mensagem">Mensagem:</label>
                <br> <br>
                <textarea rows="5" type="text" required id="Mensagem"></textarea>
                <br> <br>
                <button type="submit">Enviar</button>
            </form>

        
        </section>
